<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>باركود توأم - ur.gov.iq</title>

  <!-- مكتبة QRCode المحلية -->
  <script src="qrcode-simple.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 30px;
    }
    h2 {
      color: #1c5c93;
      font-weight: bold;
    }
    #qr-box {
      display: inline-block;
      background: #fff;
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    #note {
      margin-top: 15px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <h2>باركود التحقق - ur.gov.iq</h2>

  <div id="qr-box">
    <div id="qrcode"></div>
  </div>

  <p id="note">يمكن مسح هذا الباركود باستخدام ماسح أور الرسمي.</p>

  <script>
    // ✨ غير الرابط هنا حسب حاجتك
    const qrLink = "https://ur.gov.iq/index/verify-auth?cId=148&cUri=https%3A%2F%2Fxdata.ur.gov.iq%2Fuser-auth&serviceName=%20باستخدام%20رقم%20الهاتف";

    // توليد QR
    generateQRCode(qrLink, "qrcode", 220);
  </script>

</body>
</html>
